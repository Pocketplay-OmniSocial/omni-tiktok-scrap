[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-tiktok-scraper"
version = "0.1.0"
description = "CLI tải video TikTok không watermark khi nguồn hỗ trợ và xuất metadata JSON/CSV."
requires-python = ">=3.10"
dependencies = [
  "yt-dlp>=2024.8.6",
  "curl_cffi>=0.15.0",
]

[project.scripts]
omni-tiktok-scraper = "omni_tiktok_scraper.cli:main"
omni-tiktok-web = "omni_tiktok_scraper.web:main"

[tool.setuptools.packages.find]
where = ["src"]
